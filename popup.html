<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #eee;
      margin: 0;
      padding: 10px;
      width: 460px;
    }
    h2 { margin:0 0 8px; font-size:1.2em; }
    label { display:block; margin:6px 0 3px; color:#aaa; font-size:0.9em; }
    input[type="text"] { width:100%; box-sizing:border-box; padding:6px; border-radius:4px; border:1px solid #555; background:#2a2a2a; color:#eee; }
    button { background:#333; color:#eee; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; transition:background 0.2s; }
    button:hover:not(:disabled) { background:#555; }
    #driveRow { display:flex; gap:6px; align-items:center; }
    #driveRow input { flex:1; }
    #driveBtn { background:#2d5a8a; white-space:nowrap; }
    #driveBtn:hover:not(:disabled) { background:#3a6ea8; }
    #driveMessage { min-height:1.2em; margin-top:6px; font-size:0.9em; color:#aaa; white-space:pre-wrap; }
    #driveMessage.error { color:#f88; }
    #driveMessage.ok { color:#7c7; }
    #downloads { max-height:320px; }
  </style>
  <link rel="stylesheet" href="downloads.css" />
</head>
<body>
  <h2>Google Drive download</h2>
  <form id="driveForm">
    <label for="driveUrl">Public folder URL</label>
    <input type="text" id="driveUrl" placeholder="https://drive.google.com/drive/folders/…" autocomplete="off" />
    <label for="driveExtensions">File extensions (searched in subfolders too)</label>
    <div id="driveRow">
      <input type="text" id="driveExtensions" placeholder=".gpx, .gp" autocomplete="off" />
      <button type="submit" id="driveBtn">⬇ Download</button>
    </div>
  </form>
  <div id="driveMessage"></div>
  <div id="downloads">
    <h3>Downloads <span id="serverStatus">● checking server…</span><button id="clearDownloadsBtn" title="Remove finished downloads from the list (files stay on disk)">🧹 Clear list</button></h3>
    <ul id="downloadList"></ul>
    <div id="downloadsEmpty" style="display:none;">No downloads</div>
  </div>
  <script src="downloads.js"></script>
  <script src="popup.js"></script>
</body>
</html>
